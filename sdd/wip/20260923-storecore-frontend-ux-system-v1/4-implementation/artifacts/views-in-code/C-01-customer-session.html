<section class="sc-page sc-auth" aria-labelledby="customer-session-title">
  <div class="sc-auth__card">
    <h1 id="customer-session-title">Sesión customer</h1>
    <p class="sc-page__lede">Identidad de compra. No es el acceso de operadores.</p>
    <sc-feature-status [loading]="state.loading" [error]="state.errorMessage" />
    @if (authenticated) {
      <p>Sesión customer activa en esta instalación.</p>
      <button type="button" class="sc-btn sc-btn--ghost sc-btn--block" (click)="signOut.emit()">Cerrar sesión</button>
      <a class="sc-btn sc-btn--primary sc-btn--block" routerLink="/catalog">Ir a comprar</a>
    } @else {
      <form class="sc-auth__form" (submit)="$event.preventDefault(); submitSignIn.emit()">
        <label>Email
          <input name="email" type="email" required autocomplete="email" [ngModel]="state.email" (ngModelChange)="emailChange.emit($event)" />
        </label>
        <label>Contraseña
          <input name="password" type="password" required autocomplete="current-password" [ngModel]="state.password" (ngModelChange)="passwordChange.emit($event)" />
        </label>
        <button type="submit" class="sc-btn sc-btn--primary sc-btn--block">Entrar</button>
      </form>
      <p><a routerLink="/customer/register">Crear cuenta</a></p>
    }
  </div>
</section>
