openapi: 3.0.3
info:
  title: StoreCore unified access entry
  version: 1.0.0-wip
paths:
  /api/v1/auth/login:
    post:
      summary: Verify credentials and resolve access context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, writeOnly: true }
                returnPath: { type: string }
      responses:
        '200':
          description: Authenticated or context selection required
          headers:
            Set-Cookie: { schema: { type: string } }
            X-CSRF-Token: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResolution' }
        '401': { description: Generic authentication rejection }
        '429': { description: Shared authentication budget exhausted }
  /api/v1/auth/context-selection:
    post:
      summary: Consume a verified context challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, context]
              properties:
                challenge: { type: string, writeOnly: true }
                context: { type: string, enum: [CUSTOMER, USER] }
      responses:
        '200': { description: One realm session issued }
        '401': { description: Generic invalid or expired challenge }
        '403': { description: Invalid origin or challenge binding }
components:
  schemas:
    LoginResolution:
      oneOf:
        - $ref: '#/components/schemas/Authenticated'
        - $ref: '#/components/schemas/ContextSelectionRequired'
      discriminator:
        propertyName: kind
        mapping:
          AUTHENTICATED: '#/components/schemas/Authenticated'
          CONTEXT_SELECTION_REQUIRED: '#/components/schemas/ContextSelectionRequired'
    Authenticated:
      type: object
      required: [kind, context, home]
      properties:
        kind: { type: string, enum: [AUTHENTICATED] }
        context: { type: string, enum: [CUSTOMER, USER] }
        home: { type: string, enum: [STOREFRONT, OPERATIONS] }
    ContextSelectionRequired:
      type: object
      required: [kind, contexts, expiresAt]
      properties:
        kind: { type: string, enum: [CONTEXT_SELECTION_REQUIRED] }
        contexts:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string, enum: [CUSTOMER, USER] }
        expiresAt: { type: string, format: date-time }
