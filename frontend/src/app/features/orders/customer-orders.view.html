<section class="sc-page" aria-labelledby="orders-title">
  <h1 id="orders-title">Mis órdenes</h1>
  <sc-feature-status
    [loading]="loading"
    [error]="error"
    [empty]="!loading && orders.length === 0"
    emptyText="Aún no hay órdenes."
  />
  @if (orders.length) {
    <table class="sc-table">
      <thead>
        <tr>
          <th>Orden</th>
          <th>Pago</th>
          <th>Estado</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        @for (order of orders; track order.id) {
          <tr>
            <td><a [routerLink]="['/customer/orders', order.id]">{{ order.id }}</a></td>
            <td><span class="sc-badge sc-badge--info">{{ order.paymentStatus }}</span></td>
            <td><span class="sc-badge">{{ order.orderStatus }}</span></td>
            <td class="sc-price">{{ order.total }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
