<section class="sc-home" aria-labelledby="home-title">
  <header class="sc-page-head"><p class="sc-kicker">Tienda</p><h1 id="home-title">Inicio</h1></header>
  <sc-feature-status [loading]="loading" [error]="error" [empty]="homeEmpty" emptyText="La tienda todavía no tiene contenido de inicio publicado." (retry)="retry.emit()" />
  <sc-home-blocks [sections]="home?.sections ?? []" [categories]="categories" [products]="offers" />
</section>
