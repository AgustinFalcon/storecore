<section class="sc-page sc-console" aria-labelledby="inv-title">
  <h1 id="inv-title">Inventario WEB</h1>
  <p class="sc-page__lede">Sólo lectura. Esta vista no edita stock.</p>
  <sc-feature-status
    [loading]="loading"
    [error]="error"
    [empty]="!loading && rows.length === 0"
    emptyText="Sin disponibilidad WEB."
  />
  @if (rows.length) {
    <table class="sc-table">
      <thead>
        <tr>
          <th>SKU</th>
          <th>Disponible</th>
          <th>Reservado</th>
          <th>Safety</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track row.sku) {
          <tr>
            <td class="sc-mono">{{ row.sku }}</td>
            <td>{{ row.availableQuantity }}</td>
            <td>{{ row.reservedQuantity }}</td>
            <td>{{ row.safetyStock }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
