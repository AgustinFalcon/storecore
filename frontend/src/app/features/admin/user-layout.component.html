<nav class="sc-console-nav" aria-label="Consola operador">
  <a routerLink="/user/home" routerLinkActive="is-active">Inicio</a>
  @for (action of actions(); track action) {
    <a [routerLink]="action.path" routerLinkActive="is-active">{{ action.label }}</a>
  }
  <a routerLink="/login">Cambiar acceso</a>
  @if (session.actorId()) {
    <button type="button" class="sc-console-nav__out" (click)="signOut()">Salir</button>
  }
</nav>
@if (errorMessage) { <p role="alert">{{ errorMessage }}</p> }
<router-outlet />
