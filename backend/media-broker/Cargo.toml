[package]
name = "storecore-media-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "Proprietary"

[dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "net", "process", "std"] }
sha2 = { version = "=0.11.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
overflow-checks = true
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
