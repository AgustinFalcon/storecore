spring:
  application:
    name: storecore-backend
  datasource:
    url: ${STORECORE_DB_URL:jdbc:postgresql://localhost:5434/storecore}
    username: ${STORECORE_DB_USERNAME:storecore}
    password: ${STORECORE_DB_PASSWORD:storecore}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

storecore:
  installation:
    origin: ${STORECORE_INSTALLATION_ORIGIN:http://localhost:4200}
  integrations:
    refetch-delay-ms: 30000
    mp-orders:
      adapter: unconfigured
      accepted-topic: ""
      expected-user-id: ""
      expected-application-id: ""
      checkout-url-hosts: []
      api-base-url: ""
      access-token-ref: ""
      webhook-secret-ref: ""
