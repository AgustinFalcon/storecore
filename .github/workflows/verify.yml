name: Verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      - name: Verify tracked repository hygiene
        run: |
          node --test .github/scripts/repository-hygiene.test.mjs
          node .github/scripts/repository-hygiene.mjs

  backend:
    needs: repository-hygiene
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storecore
          POSTGRES_USER: storecore
          POSTGRES_PASSWORD: storecore
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U storecore -d storecore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: false
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/media-worker/pom.xml
      - name: Pin Temurin 21.0.13+9
        run: node .github/scripts/assert-temurin-21.mjs
      - name: Test backend
        working-directory: backend
        run: mvn -B test
      - name: Verify media-worker supply chain
        working-directory: backend/media-worker
        run: mvn -B verify
      - name: Verify backend factory against the packaged media-worker
        working-directory: backend
        run: >-
          mvn -B -Dtest=MediaWorkerPackagedCapabilityIntegrationTest
          -Dstorecore.media.worker.packagedJar="$GITHUB_WORKSPACE/backend/media-worker/target/storecore-media-worker-0.1.0-SNAPSHOT.jar"
          test
      - name: Run packaged media-worker SELF_TEST
        run: |
          worker_jar="$GITHUB_WORKSPACE/backend/media-worker/target/storecore-media-worker-0.1.0-SNAPSHOT.jar"
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT
          printf '%s' 'U0NNVwEAAAAAAAA0AQIAAJG51KydL0rZpy4IulMLV8AREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMA==' \
            | base64 --decode > "$workspace/request.bin"
          (
            cd "$workspace"
            java -jar "$worker_jar"
          )
          test -s "$workspace/result.bin"
          test ! -e "$workspace/output.bin"
      - name: Fail closed on HIGH and CRITICAL media-worker CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: backend/media-worker/target/bom.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Install real schema interlock prerequisites
        run: sudo apt-get update && sudo apt-get install -y postgresql-client unzip
      - name: Reject the previous real artifact against managed media schema
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STORECORE_DB_URL: jdbc:postgresql://127.0.0.1:5434/storecore
          STORECORE_DB_USERNAME: storecore
          STORECORE_DB_PASSWORD: storecore
          STORECORE_PSQL_URL: postgresql://storecore:storecore@127.0.0.1:5434/storecore
        run: bash backend/scripts/test-catalog-media-real-interlock.sh "$BASE_SHA"

  media-broker:
    needs: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.100.0
          --profile minimal
          --component clippy,rustfmt
      - name: Verify broker format, lints and Linux tests with the lockfile
        working-directory: backend/media-broker
        run: |
          cargo +1.100.0 fmt --all -- --check
          cargo +1.100.0 clippy --locked --all-targets -- -D warnings
          cargo +1.100.0 test --locked --all-targets
      - name: Verify broker dependency licenses
        working-directory: backend/media-broker
        run: node scripts/verify-license-policy.mjs
      - name: Generate broker CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/media-broker
          format: cyclonedx
          output: backend/media-broker/target/bom.json
          exit-code: '1'
      - name: Fail closed on HIGH and CRITICAL broker CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: backend/media-broker/target/bom.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

  media-broker-pid1:
    needs: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: false
          cache: maven
          cache-dependency-path: backend/media-worker/pom.xml
      - name: Pin Temurin 21.0.13+9
        run: node .github/scripts/assert-temurin-21.mjs
      - name: Package the media-worker jar
        working-directory: backend/media-worker
        run: mvn -B -DskipTests package
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.100.0
          --profile minimal
          --component clippy,rustfmt
      - name: Start derived tmpfs and worker units through PID 1
        working-directory: backend/media-broker
        run: |
          sudo useradd --system --no-create-home --uid 2101 storecore-backend
          sudo useradd --system --no-create-home --uid 2102 storecore-worker
          runtime=/usr/lib/storecore-media-runtime
          sudo mkdir -p "$runtime"
          sudo cp -a "$(readlink -f "$JAVA_HOME")" "$runtime/jdk"
          sudo install -m 0444 \
            "$GITHUB_WORKSPACE/backend/media-worker/target/storecore-media-worker-0.1.0-SNAPSHOT.jar" \
            "$runtime/worker.jar"
          sudo chown -R root:root "$runtime"
          sudo chmod -R a+rX,go-w "$runtime"
          sudo find "$runtime" -type d -exec chmod 0555 {} \;
          sudo chmod 0555 "$runtime/jdk/bin/java"
          sudo chmod 0444 "$runtime/worker.jar"
          export STORECORE_MEDIA_JAVA="$runtime/jdk/bin/java"
          export STORECORE_MEDIA_JAR="$runtime/worker.jar"
          sudo --preserve-env=PATH,CARGO_HOME,RUSTUP_HOME,STORECORE_MEDIA_JAVA,STORECORE_MEDIA_JAR \
            "$(command -v cargo)" +1.100.0 test --locked --all-targets \
            -- --ignored --test-threads=1 pid1_

  frontend:
    needs: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify Angular architecture, lint, tests and build
        working-directory: frontend
        run: npm run verify
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Public-page accessibility smoke (backend-less)
        working-directory: frontend
        run: npm run test:a11y

  productive-routes-real-e2e:
    needs: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storecore_ua_e2e
          POSTGRES_USER: storecore
          POSTGRES_PASSWORD: storecore
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U storecore -d storecore_ua_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: false
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/media-worker/pom.xml
      - name: Pin Temurin 21.0.13+9
        run: node .github/scripts/assert-temurin-21.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated-runtime prerequisites
        run: sudo apt-get update && sudo apt-get install -y postgresql-client openssl iptables acl
      - name: Package backend at the checked-out SHA
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Build and check productive route acceptance
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/storecore-psd-browsers
        run: |
          npm ci
          npm run build
          npm run build:demo
          npm run check:psd-real
          npx playwright install --with-deps chromium
      - name: Create dedicated runtime and enforce IPv4/IPv6 loopback-only egress
        run: |
          sudo useradd --system --create-home --shell /bin/bash storecore-psd
          runtime_uid=$(id -u storecore-psd)
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$runtime_uid" ! -d 127.0.0.0/8 -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner "$runtime_uid" ! -d ::1/128 -j REJECT
          sudo iptables -C OUTPUT -m owner --uid-owner "$runtime_uid" ! -d 127.0.0.0/8 -j REJECT
          sudo ip6tables -C OUTPUT -m owner --uid-owner "$runtime_uid" ! -d ::1/128 -j REJECT
          printf '198.51.100.1 psd-egress.invalid\n' | sudo tee -a /etc/hosts >/dev/null
          printf '{"uid":%s,"ipv4":"reject-non-loopback","ipv6":"reject-non-loopback"}\n' "$runtime_uid" | sudo tee /run/storecore-psd-egress.json >/dev/null
          sudo chmod 644 /run/storecore-psd-egress.json
          sudo chmod -R a+rX "${{ runner.temp }}/storecore-psd-browsers"
          workspace_parent=$(dirname "$GITHUB_WORKSPACE")
          work_root=$(dirname "$workspace_parent")
          runner_home=$(dirname "$work_root")
          sudo setfacl -m u:storecore-psd:--x "$runner_home" "$work_root" "$workspace_parent"
          sudo chown storecore-psd:storecore-psd "$GITHUB_WORKSPACE"
          sudo chown -R storecore-psd:storecore-psd frontend
          sudo -u storecore-psd test -r "$GITHUB_WORKSPACE/frontend/scripts/run-psd-real-e2e.mjs"
      - name: Run real PostgreSQL, Spring, production Angular and Chromium matrix
        working-directory: frontend
        run: |
          sudo -u storecore-psd setpriv --no-new-privs env -i PATH="$PATH" JAVA_HOME="$JAVA_HOME" HOME=/home/storecore-psd \
            LANG=C.UTF-8 CI=true PLAYWRIGHT_BROWSERS_PATH="${{ runner.temp }}/storecore-psd-browsers" \
            PGHOST=127.0.0.1 PGPORT=5434 PGDATABASE=storecore_ua_e2e PGUSER=storecore PGPASSWORD=storecore \
            STORECORE_PSD_EGRESS_PROOF=/run/storecore-psd-egress.json GITHUB_SHA="$GITHUB_SHA" \
            "$(command -v node)" "$GITHUB_WORKSPACE/frontend/scripts/run-psd-real-e2e.mjs"
      - name: Verify required evidence exists
        if: always()
        working-directory: frontend
        run: |
          test -s psd-real-results/junit.xml
          test -s psd-real-results/report/index.html
          test -s psd-real-results/fixture-receipt.json
          test -s psd-real-results/egress.json
          test -s psd-real-results/runtime-summary.json
          test -s psd-real-results/route-census.json
          test -s psd-real-results/action-census.json
          test -s psd-real-results/route-diagnostics.json
      - name: Save productive route evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: productive-routes-real-e2e-${{ github.sha }}
          path: |
            frontend/psd-real-results/junit.xml
            frontend/psd-real-results/report/index.html
            frontend/psd-real-results/fixture-receipt.json
            frontend/psd-real-results/egress.json
            frontend/psd-real-results/route-census.json
            frontend/psd-real-results/action-census.json
            frontend/psd-real-results/route-diagnostics.json
            frontend/psd-real-results/runtime-summary.json
            frontend/psd-real-results/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Remove only the dedicated runtime firewall rules
        if: always()
        run: |
          if id storecore-psd >/dev/null 2>&1; then
            runtime_uid=$(id -u storecore-psd)
            sudo iptables -D OUTPUT -m owner --uid-owner "$runtime_uid" ! -d 127.0.0.0/8 -j REJECT || true
            sudo ip6tables -D OUTPUT -m owner --uid-owner "$runtime_uid" ! -d ::1/128 -j REJECT || true
          fi
          sudo rm -f /run/storecore-psd-egress.json

  unified-access-real-e2e:
    needs: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storecore_ua_e2e
          POSTGRES_USER: storecore
          POSTGRES_PASSWORD: storecore
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U storecore -d storecore_ua_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5434'
      PGDATABASE: storecore_ua_e2e
      PGUSER: storecore
      PGPASSWORD: storecore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          check-latest: false
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/media-worker/pom.xml
      - name: Pin Temurin 21.0.13+9
        run: node .github/scripts/assert-temurin-21.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install database client and test certificate tool
        run: sudo apt-get update && sudo apt-get install -y postgresql-client openssl
      - name: Package real backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Prepare recovery test-only JVM classpath
        working-directory: backend
        run: mvn -B org.apache.maven.plugins:maven-dependency-plugin:build-classpath -DincludeScope=test -Dmdep.outputFile=target/recovery-e2e-classpath.txt
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real PostgreSQL, Spring, Angular HTTPS and browser UA matrix
        working-directory: frontend
        run: |
          npm run check:ua-real
          npm run test:ua-real
          npm run check:recovery-success-real
          npm run test:recovery-success-real
      - name: Save browser and server evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unified-access-real-e2e-${{ github.sha }}
          path: |
            frontend/ua-real-results/
            frontend/recovery-real-results/
          if-no-files-found: ignore
          retention-days: 7
